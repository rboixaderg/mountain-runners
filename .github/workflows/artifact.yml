name: Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SITE_ORIGIN: https://mountainrunners.cat
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve editorial date (Europe/Madrid)
        run: echo "BUILD_TODAY=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_ENV"
      - name: Build and verify artifact
        run: node tools/release/build-artifact.mjs
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mountain-runners-release
          path: artifacts/release/
          retention-days: 30
          if-no-files-found: error

  reproducibility:
    name: Verify reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SITE_ORIGIN: https://mountainrunners.cat
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve editorial date (Europe/Madrid)
        run: echo "BUILD_TODAY=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_ENV"
      - name: Verify two clean builds produce identical digests
        run: node tools/release/verify-reproducibility.mjs
