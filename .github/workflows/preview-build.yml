name: Preview build

# Untrusted preview build (T6.3): the pull request job receives no secrets,
# shares no caches with trusted jobs and publishes only an intermediate
# artifact. Forks build too (the artifact is never published); the trusted
# publisher rejects them.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build preview artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
      PUBLIC_SITE_ORIGIN: https://pr-${{ github.event.pull_request.number }}.preview.mountainrunners.cat
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The manifest binds the artifact to the PR head SHA: the content
          # built must be exactly that commit, not the merge ref that a
          # pull_request checkout uses by default.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Resolve editorial date (Europe/Madrid)
        run: echo "BUILD_TODAY=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_ENV"
      - name: Run the full quality gate in the untrusted context
        run: pnpm validate
      - name: Build and verify the preview artifact
        run: node tools/preview/build-artifact.mjs
      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mountain-runners-preview
          path: artifacts/preview/
          retention-days: 7
          if-no-files-found: error
