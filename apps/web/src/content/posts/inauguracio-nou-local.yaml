title:
  ca: Mountain Runners inaugura el nou local a la plaça de Sant Joan de Berga
summary:
  ca: El club estrena un local més ampli i més ben ubicat per donar-se a conèixer i organitzar més activitats per als socis. La inauguració va reunir socis i no socis en un ambient distès i festiu.
lead:
  ca: Mountain Runners del Berguedà va inaugurar el nou local el 26 de setembre de 2026, a la plaça de Sant Joan, número 15, de Berga. El canvi respon a la necessitat de disposar de més espai i d'una millor ubicació per a les activitats del club.
sections:
  - body:
      ca: El nou local ofereix més possibilitats que l'anterior per organitzar activitats orientades als socis. Amb aquest espai, el club vol ampliar les propostes que els ofereix i tenir més visibilitat a Berga.
  - body:
      ca: La jornada d'inauguració va començar amb una caminada a Queralt i va continuar amb un piscolabis al nou local. En un ambient distès i festiu, socis i no socis van poder compartir una estona i conèixer el nou espai. La trobada també va servir per donar informació sobre les escoles i les properes activitats del club.
