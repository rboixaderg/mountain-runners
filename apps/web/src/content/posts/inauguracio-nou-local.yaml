title:
  ca: Mountain Runners del Berguedà estrena nou local a Berga
summary:
  ca: El club inaugura un nou espai a la plaça de Sant Joan, 15, amb l'objectiu de disposar de més espai per a les activitats i guanyar visibilitat a la ciutat.
lead:
  ca: Mountain Runners del Berguedà va inaugurar el passat 26 de setembre el seu nou local, situat a la plaça de Sant Joan, número 15, de Berga. El canvi de seu respon a la necessitat del club de comptar amb un espai més ampli i amb una ubicació que permeti potenciar les seves activitats i la relació amb els socis.
sections:
  - body:
      ca: El nou local ofereix més possibilitats per organitzar activitats i propostes dirigides als socis, i obre la porta a ampliar l'oferta del club en els propers mesos. Alhora, la nova ubicació permet reforçar la seva presència i visibilitat a Berga.
  - heading:
      ca: Una jornada per estrenar el nou espai
    body:
      ca: |
        La jornada d'inauguració va començar amb una caminada a Queralt, una activitat que va donar el tret de sortida a una jornada pensada per compartir l'estrena del nou local amb socis i no socis.

        Després de la caminada, els participants es van reunir al nou espai per gaudir d'un piscolabis en un ambient distès i festiu. La trobada va permetre conèixer de primera mà el local i compartir una estona entre persones vinculades al club i altres interessades en les seves activitats.

        L'acte també va servir per donar a conèixer les escoles del club, les idees que es portaran a terme pròximament i informar sobre les activitats ja programades dels Mountain Runners del Berguedà, amb la voluntat de continuar fent créixer la comunitat i generar noves oportunitats de participació.

        Amb aquesta nova seu, els Mountain Runners del Berguedà inicien una nova etapa amb un espai pensat per acollir més activitats, facilitar la trobada entre socis i continuar fent créixer el club a Berga i al Berguedà.
