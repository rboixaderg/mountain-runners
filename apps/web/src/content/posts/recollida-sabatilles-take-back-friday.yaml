title:
  ca: El club ha recollit sabatilles usades per al Take Back Friday de NNormal
summary:
  ca: El club ha recollit sabatilles de córrer d'asfalt i de muntanya, de qualsevol marca, al local social durant la campanya Take Back Friday de NNormal, que ha acabat el 29 de novembre.
lead:
  ca: Mountain Runners del Berguedà ha recollit sabatilles de córrer usades durant el Take Back Friday de NNormal, la campanya que dona una segona vida a aquest material. Les sabatilles s'han portat al local social del club, a la plaça de Sant Joan, 15, baixos, de Berga, fins al 29 de novembre.
sections:
  - heading:
      ca: Què és el Take Back Friday
    body:
      ca: És una iniciativa de NNormal que recull sabatilles de córrer usades i els busca un segon ús. El club ja hi havia col·laborat en ocasions anteriors.
  - heading:
      ca: Què s'hi ha portat
    body:
      ca: Sabatilles de córrer d'asfalt i de muntanya, de qualsevol marca.
  - heading:
      ca: On s'han portat
    body:
      ca: Al local social del club, a la plaça de Sant Joan, 15, baixos, de Berga, el mateix espai que el club va estrenar el 26 de setembre.
  - heading:
      ca: Per què
    body:
      ca: La campanya redueix residus i dóna una segona vida a les sabatilles usades.
