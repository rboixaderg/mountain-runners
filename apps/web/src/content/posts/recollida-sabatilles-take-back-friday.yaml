  ca: Pots portar sabatilles de córrer d'asfalt o de muntanya, de qualsevol marca, al local social fins al 29 de novembre de 2026.
lead:
  ca: Mountain Runners del Berguedà continua col·laborant amb la iniciativa Take Back Friday de NNormal, una campanya que recull sabatilles de córrer usades per donar-los una segona vida. Les sabatilles es poden deixar al local social del club, a la plaça de Sant Joan, 15, baixos, de Berga, fins al 29 de novembre de 2026.
