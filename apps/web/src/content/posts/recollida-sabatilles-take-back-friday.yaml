  ca: El club torna a recollir sabatilles usades fins al 29 de novembre
summary:
  ca: El club participa de nou en el Take Back Friday de NNormal, que recull sabatilles de córrer usades al local social fins al 29 de novembre.
lead:
  ca: Mountain Runners del Berguedà torna a participar en el Take Back Friday de NNormal, una campanya que recull sabatilles de córrer usades per donar-los una segona vida. Les sabatilles es poden deixar al local social del club, a la plaça de Sant Joan, 15, baixos, de Berga, fins al 29 de novembre.
sections:
  - heading:
      ca: Què s'hi pot portar
    body:
      ca: S'accepten sabatilles de córrer d'asfalt i de muntanya, de qualsevol marca.
  - heading:
      ca: On i fins quan
    body:
      ca: El punt de recollida és el local social del club, a la plaça de Sant Joan, 15, baixos, de Berga. El termini acaba el 29 de novembre.
  - heading:
      ca: Per què
    body:
      ca: La campanya redueix residus i dóna una segona vida a les sabatilles usades.
