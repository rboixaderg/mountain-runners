  - heading:
      ca: On i fins quan
    body:
      ca: |
        Punt de recollida: local social del club, a la plaça de Sant Joan, 15, baixos, de Berga.

        El termini acaba el 29 de novembre de 2026.
  - heading:
      ca: Per què
    body:
      ca: La campanya redueix residus i dóna una segona vida a les sabatilles usades.
