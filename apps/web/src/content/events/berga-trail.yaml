summary:
  ca: >-
    Cursa de muntanya organitzada per Mountain Runners que recorre l'entorn de
    Queralt, els Rasos de Peguera i la Serra d'Ensija.
  es: Carrera de montaña organizada por Mountain Runners que recorre el entorno de Queralt, los Rasos de Peguera y la sierra de Ensija.
  en: A mountain race organised by Mountain Runners through the Queralt area, Rasos de Peguera and the Ensija range.
description:
  ca: >-
    La Marató de Muntanya de Berga va néixer el 2004, el mateix any que
    l'Associació Esportiva Mountain Runners del Berguedà. La cursa recorria
    Queralt, els Rasos de Peguera i la Serra d'Ensija, i va arribar a ser prova
    de la Copa del Món en les seves quarta i cinquena edició.


    Atletes com Tòfol Castanyer, Núria Picas, Corinne Favre, Pau Bartoló o
    Jessed Hernández hi han pres la sortida en edicions històriques. L'esdeveniment
    ja no es celebra, però forma part de la història del club i del trail
    running al Berguedà.
  es: >-
    La Maratón de Montaña de Berga nació en 2004, el mismo año que la Asociación
    Deportiva Mountain Runners del Berguedà. La carrera recorría Queralt, los
    Rasos de Peguera y la sierra de Ensija, y llegó a ser prueba de la Copa del
    Mundo en su cuarta y quinta edición.


    Atletas como Tòfol Castanyer, Núria Picas, Corinne Favre, Pau Bartoló o
    Jessed Hernández tomaron la salida en ediciones históricas. El evento ya no
    se celebra, pero forma parte de la historia del club y del trail running en
    el Berguedà.
  en: >-
    The Berga Mountain Marathon began in 2004, the same year as the Associació
    Esportiva Mountain Runners del Berguedà. The race ran through Queralt, Rasos
    de Peguera and the Ensija range, and was a World Cup event in its fourth and
    fifth editions.


    Athletes such as Tòfol Castanyer, Núria Picas, Corinne Favre, Pau Bartoló and
    Jessed Hernández took the start in historic editions. The event is no longer
    held, but remains part of the club's history and the history of trail running
    in Berguedà.
