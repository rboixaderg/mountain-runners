description:
  ca: >-
    El Cros de Queralt és la prova de Berga del Cros Escolar del Berguedà, el
    circuit de cros dels Jocs Esportius Escolars organitzat pel [Consell Esportiu
    del Berguedà](https://www.cebergueda.cat/cros/).


    La prova es disputa a l'entorn del Santuari de Queralt i està oberta a
    l'alumnat dels centres educatius, d'Educació Infantil a Cadet, amb distàncies
    adaptades a cada categoria.


    Mountain Runners del Berguedà hi col·labora amb l'Ajuntament de Berga.
  es: >-
    El Cros de Queralt es la prueba de Berga del Cros Escolar del Berguedà, el
    circuito de cross de los Juegos Deportivos Escolares organizado por el
    [Consell Esportiu del
    Berguedà](https://www.cebergueda.cat/cros/).


    La prueba se disputa en el entorno del Santuario de Queralt y está abierta
    al alumnado de los centros educativos, de Educación Infantil a Cadete, con
    distancias adaptadas a cada categoría.


    Mountain Runners del Berguedà colabora junto con el Ayuntamiento de Berga.
  en: >-
    The Cros de Queralt is the Berga round of the Cros Escolar del Berguedà, the
    cross-country series of the county school games organised by the [Consell
    Esportiu del Berguedà](https://www.cebergueda.cat/cros/).


    The race takes place around the Queralt Sanctuary and is open to pupils from
    pre-school to cadet age, with distances adapted to each age group.


    Mountain Runners del Berguedà collaborates together with Berga Town
    Council.
