description:
  ca: >-
    La Minivolta a la Maria és la cursa infantil de la [Volta a la
    Maria](https://voltaalamaria.wixsite.com/misitio), la cursa de muntanya
    d'Avià, i està organitzada per Mountain Runners del Berguedà.


    Amb sortida i arribada al nucli d'Avià, la cursa recorre els carrers del
    poble amb distàncies adaptades a cada edat: des dels 400 m per a les
    categories més petites fins als 2 km per als infantils.


    Es disputa el cap de setmana de la Volta a la Maria, juntament amb la
    Clàssica, la Nocturna i l'Amunt Maria.
  es: >-
    La Minivolta a la Maria es la carrera infantil de la [Volta a la
    Maria](https://voltaalamaria.wixsite.com/misitio), la carrera de montaña de
    Avià, y está organizada por Mountain Runners del Berguedà.


    Con salida y llegada en el núcleo de Avià, la carrera recorre las calles
    del pueblo con distancias adaptadas a cada edad: desde los 400 m para las
    categorías más pequeñas hasta los 2 km para los infantiles.


    Se disputa el fin de semana de la Volta a la Maria, junto con la Clàssica,
    la Nocturna y el Amunt Maria.
  en: >-
    The Minivolta a la Maria is the children's race of the [Volta a la
    Maria](https://voltaalamaria.wixsite.com/misitio), Avià's mountain race, and
    is organised by Mountain Runners del Berguedà.


    With start and finish in the village of Avià, the race runs through the
    village streets with distances adapted to each age: from 400 m for the
    youngest categories to 2 km for the infantiles.


    It is held on the Volta a la Maria weekend, together with the Clàssica, the
    Nocturna and the Amunt Maria.
