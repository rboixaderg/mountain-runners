description:
  ca: >-
    La Baixada de Torxes surt del Santuari de Queralt i baixa fins a l'església
    de Sant Francesc, a Berga. Es fa el 13 de desembre de 2026, en el marc de les
    activitats del Mercat del Regal de Nadal de Berga, i els beneficis de
    l'activitat es destinen a la Marató de TV3.


    L'activitat l'organitzen conjuntament l'Ajuntament de Berga, Berga
    Comercial, Mountain Runners del Berguedà, Club Esquí Berguedà i Ironwill
    Berga.
