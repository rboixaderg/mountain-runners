summary:
  ca: >-
    Cap de setmana de curses de muntanya a Berga, organitzat amb el Club Esquí
    Berguedà: la Marató de Muntanya de Berga, la Berga–Rasos–Berga, la
    Berga–Queralt–Berga i els Correxics infantils.
  es: >-
    Fin de semana de carreras de montaña en Berga, organizado con el Club Esquí
    Berguedà: la Marató de Muntanya de Berga, la Berga–Rasos–Berga, la
    Berga–Queralt–Berga y los Correxics infantiles.
  en: >-
    A weekend of mountain races in Berga, organised with Club Esquí Berguedà:
    the Berga Mountain Marathon, Berga–Rasos–Berga, Berga–Queralt–Berga and the
    Correxics children's races.
description:
  ca: >-
    Les Clàssiques de Berga van néixer el 2024 de la unió de la Berga–Rasos–Berga
    del Club Esquí Berguedà i la Berga Trail de Mountain Runners, i van recuperar
    la mítica [Marató de Muntanya de
    Berga](https://www.lesclassiquesberga.com/maratodemuntanya).


    El cap de setmana concentra a Berga i al Pla de Corbera (Castellar del Riu)
    tres curses per a adults i els Correxics per a les categories infantils.
    L'esdeveniment és un referent en les curses de muntanya.


    L'esdeveniment està organitzat pel Club Esquí Berguedà i Mountain Runners del
    Berguedà, amb la col·laboració de l'Ajuntament de Berga i el suport del
    Consell Comarcal del Berguedà.
  es: >-
    Les Clàssiques de Berga nacieron en 2024 de la unión de la Berga–Rasos–Berga
    del Club Esquí Berguedà y la Berga Trail de Mountain Runners, y recuperaron
    la mítica [Marató de Muntanya de
    Berga](https://www.lesclassiquesberga.com/maratodemuntanya).


    El fin de semana reúne en Berga y en el Pla de Corbera (Castellar del Riu)
    tres carreras para adultos y los Correxics para las categorías infantiles.
    El evento es un referente en las carreras de montaña.


    El evento está organizado por el Club Esquí Berguedà y Mountain Runners del
    Berguedà, con la colaboración del Ayuntamiento de Berga y el apoyo del
    Consell Comarcal del Berguedà.
  en: >-
    Les Clàssiques de Berga was born in 2024 from the union of the Club Esquí
    Berguedà's Berga–Rasos–Berga and Mountain Runners' Berga Trail, reviving the
    legendary [Berga Mountain
    Marathon](https://www.lesclassiquesberga.com/maratodemuntanya).


    The weekend brings together three adult races and the Correxics children's
    races in Berga and at Pla de Corbera (Castellar del Riu). The event is a
    benchmark in mountain races.


    The event is organised by Club Esquí Berguedà and Mountain Runners del
    Berguedà, with the support of Berga Town Council and Consell Comarcal del
    Berguedà.
