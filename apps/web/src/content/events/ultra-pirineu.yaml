summary:
  ca: És una cursa de muntanya que recorre part de la serralada del Cadí-Moixeró.
  es: Es una carrera de montaña que recorre parte de la cordillera del Cadí-Moixeró.
  en: A mountain race that crosses part of the Cadí-Moixeró mountain range.
description:
  ca: >-
    Des dels Mountain Runners col·laboram en la Salomon Ultra Pirineu des de les
    primeres edicions de Cavalls del Vent el 2009. El 2011 vam impulsar la
    Pirineu XS des de l'Escola Trail, una de les primeres curses infantils en
    esdeveniments d'aquesta envergadura.


    Des del 2015, l'organització de la Salomon Ultra Pirineu i els MRB
    treballem conjuntament perquè any rere any es pugui gaudir d'aquest gran
    esdeveniment al Parc Natural del Cadí-Moixeró, amb sortida i arribada a
    Bagà.
  es: >-
    Mountain Runners colabora con la Salomon Ultra Pirineu desde las primeras
    ediciones de Cavalls del Vent en 2009. Desde 2015, la organización y MRB
    trabajan conjuntamente para disfrutar año tras año de este gran evento en
    el Parque Natural del Cadí-Moixeró, con salida y llegada en Bagà.
  en: >-
    Mountain Runners has collaborated with Salomon Ultra Pirineu since the first
    Cavalls del Vent editions in 2009. Since 2015, the organisation and MRB have
    worked together so that this great event can be enjoyed year after year in
    Cadí-Moixeró Natural Park, starting and finishing in Bagà.
