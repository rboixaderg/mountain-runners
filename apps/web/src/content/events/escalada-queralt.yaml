summary:
  ca: Cronoescalada de la Lliga d'escalades del Berguedà, de Berga al Santuari de Queralt.
  es: Cronoescalada de la Liga de escaladas del Berguedà, de Berga al Santuario de Queralt.
  en: Time trial climb in the Berguedà Climb League, from Berga to Queralt Sanctuary.
description:
  ca: >-
    Primera prova de la [Lliga d'escalades del
    Berguedà](https://escaladesbergueda.cat/). Cronoescalada oberta a tothom
    des de la plaça dels Països Catalans fins a l'aparcament del Santuari de
    Queralt, el «Balcó de Catalunya».


    El recorregut inclou 0,65 km neutralitzats i 6,54 km cronometrats amb 420
    metres de desnivell positiu. Es pot participar amb qualsevol tipus de
    bicicleta: carretera, BTT, gravel, ciclocròs o clàssica.


    Mountain Runners del Berguedà i el Club Esquí Berguedà coorganitzen la
    prova dins el calendari de la lliga, que promou el ciclisme de muntanya al
    territori.
  es: >-
    Primera prueba de la [Liga de escaladas del Berguedà](https://escaladesbergueda.cat/).
    Cronoescalada abierta a todos desde la plaza dels Països Catalans hasta el
    aparcamiento del Santuario de Queralt. El recorrido incluye 6,54 km
    cronometrados y 420 metros de desnivel positivo, y admite bicicleta de
    carretera, BTT, gravel, ciclocross o clásica.
  en: >-
    The first race in the [Berguedà Climb League](https://escaladesbergueda.cat/).
    An open time trial from Plaça dels Països Catalans to the Queralt Sanctuary
    car park. The route includes 6.54 timed kilometres and 420 metres of ascent,
    and is open to road bikes, MTB, gravel, cyclocross or classic bikes.
