description:
  ca: >-
    L'Anella Verda és un conjunt de curses i marxes organitzades pels Mountain
    Runners del Berguedà i el Club Atlètic Berga, amb la col·laboració de
    l'Ajuntament de Berga, que transcorren íntegrament pel municipi de Berga.


    Des de senders de muntanya amb vistes espectaculars fins a rutes que
    ressegueixen els racons més amagats de la natura berguedana, cada prova està
    pensada per oferir una experiència única. Tant si tens experiència en curses
    de muntanya com si vols gaudir d'una marxa tranquil·la en família, l'Anella
    Verda ofereix una opció per a tu.


    De moment només s'ha celebrat l'edició del 2024. No hi ha una nova data
    anunciada.
  es: >-
    La Anella Verda reúne carreras y marchas organizadas por Mountain Runners del
    Berguedà y el Club Atlètic Berga, con la colaboración del Ayuntamiento de
    Berga. Sus recorridos atraviesan el municipio y ofrecen opciones para
    corredores experimentados y familias. De momento solo se ha celebrado la
    edición de 2024 y no hay una nueva fecha anunciada.
  en: >-
    Anella Verda brings together races and walks organised by Mountain Runners
    del Berguedà and Club Atlètic Berga, with support from Berga Town Council.
    Its routes cross the municipality and offer options for experienced runners
    and families. So far only the 2024 edition has taken place, and no new date
    has been announced.
