description:
  ca: >-
    L'Anella Verda és un conjunt de curses i marxes organitzades pels Mountain
    Runners del Berguedà i el Club Atlètic Berga, amb la col·laboració de
    l'Ajuntament de Berga, que transcorren íntegrament pel municipi de Berga.


    Des de senders de muntanya amb vistes espectaculars fins a rutes que
    ressegueixen els racons més amagats de la natura berguedana, cada prova està
    pensada per oferir una experiència única. Tant si tens experiència en curses
    de muntanya com si vols gaudir d'una marxa tranquil·la en família, l'Anella
    Verda ofereix una opció per a tu.


    De moment només s'ha celebrat l'edició del 2024. No hi ha una nova data
    anunciada.
  es: >-
    La Anella Verda es un conjunto de carreras y marchas organizadas por Mountain
    Runners del Berguedà y el Club Atlètic Berga, con la colaboración del
    Ayuntamiento de Berga, que transcurren íntegramente por el municipio de Berga.


    Desde senderos de montaña con vistas espectaculares hasta rutas que recorren
    los rincones más escondidos de la naturaleza berguedana, cada prueba está
    pensada para ofrecer una experiencia única. Tanto si tienes experiencia en
    carreras de montaña como si quieres disfrutar de una marcha tranquila en
    familia, la Anella Verda ofrece una opción para ti.


    De momento solo se ha celebrado la edición de 2024. No hay una nueva fecha
    anunciada.
  en: >-
    Anella Verda is a series of races and walks organised by Mountain Runners del
    Berguedà and Club Atlètic Berga, with support from Berga Town Council, held
    entirely within the municipality of Berga.


    From mountain trails with spectacular views to routes through the most
    hidden corners of Berguedà's natural landscape, each event is designed to
    offer a unique experience. Whether you have experience in mountain races or
    want to enjoy a relaxed family walk, Anella Verda has an option for you.


    So far, only the 2024 edition has taken place. No new date has been announced.
