summary:
  ca: >-
    Activitats de BTT i Enduro per a infants i joves de 5 a 16 anys al
    Berguedà.
  es: >-
    Actividades de BTT y Enduro para niños y jóvenes de 5 a 16 años en el
    Berguedà.
  en: >-
    MTB and Enduro activities for children and young people aged 5 to 16 in
    Berguedà.
description:
  ca: >-
    L'Escola BTT és una de les branques dels MRB, juntament amb el CEB i
    Veloberga. Ofereix dues modalitats, BTT i Enduro, per a infants i joves de
    5 a 16 anys, en horari no lectiu, per l'entorn de la comarca del Berguedà.


    És un espai per descobrir la comarca amb bicicleta, aprendre tècnica i
    gaudir de la natura sense ser una escola d'alt rendiment. Els grups
    s'organitzen per nivell, no per edat.
  es: >-
    La Escuela BTT es una de las ramas de MRB, junto con el CEB y Veloberga.
    Ofrece dos modalidades, BTT y Enduro, para niños y jóvenes de 5 a 16 años,
    fuera del horario lectivo, por el entorno de la comarca del Berguedà.


    Es un espacio para descubrir la comarca en bicicleta, aprender técnica y
    disfrutar de la naturaleza sin ser una escuela de alto rendimiento. Los
    grupos se organizan por nivel, no por edad.
  en: >-
    The MTB School is one of MRB's branches, together with CEB and Veloberga. It
    offers two modalities, MTB and Enduro, for children and young people aged 5
    to 16, held outside school hours around Berguedà.


    It is a place to discover the region by bike, learn technique and enjoy
    nature, rather than a high-performance school. Groups are organised by
    level, not by age.
