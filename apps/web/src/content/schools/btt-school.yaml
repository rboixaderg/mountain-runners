sections:
  since:
    ca: >-
      L'escola pren vida l'any 2020 com a projecte pilot, creant sinergies amb
      altres entitats de Berga perquè infants i joves puguin descobrir nous
      racons de la comarca.
    es: La escuela nació en 2020 como proyecto piloto, creando sinergias con otras entidades de Berga para que los niños y jóvenes descubran nuevos rincones de la comarca.
    en: The school began in 2020 as a pilot project, creating synergies with other organisations in Berga so children and young people can discover new parts of the region.
  purpose:
    ca: >-
      Donar l'opció d'estar a la natura, aprendre'n i gaudir-ne amb bicicleta
      mentre s'aprèn tècnica, amb BTT o amb Enduro segons el nivell.
    es: Ofrecer la posibilidad de estar en la naturaleza, aprender de ella y disfrutarla en bicicleta mientras se aprende técnica, con BTT o Enduro según el nivel.
    en: To offer the chance to spend time in nature, learn from it and enjoy it by bike while learning technique, with MTB or Enduro according to level.
  audience:
    ca: Infants i joves de 5 a 16 anys. Grups per nivell, no per edat.
    es: Niños y jóvenes de 5 a 16 años. Grupos por nivel, no por edad.
    en: Children and young people aged 5 to 16. Groups by level, not by age.
  schedule:
    ca: >-
      **BTT**


      Dimarts de 17.30 h a 19.00 h a Avià (tècnica i habilitats).


      Dissabte de 10.00 h a 13.00 h, itinerant per la comarca (ruta i
      perfeccionament).


      **Enduro**


      Dimarts de 17.30 h a 19.00 h al 4Riders Bike Park o altres espais (dia
      base obligatori).


      Dijous de 17.30 h a 19.00 h, localització variable (sessió
      complementària).


      Curs 2026/2027. Inici: 15 de setembre de 2026.
    es: >-
      **BTT**


      Martes de 17:30 a 19:00 en Avià (técnica y habilidades).


      Sábados de 10:00 a 13:00, itinerante por la comarca (ruta y
      perfeccionamiento).


      **Enduro**


      Martes de 17:30 a 19:00 en el 4Riders Bike Park u otros espacios (día base
      obligatorio).


      Jueves de 17:30 a 19:00, localización variable (sesión complementaria).


      Curso 2026/2027. Inicio: 15 de septiembre de 2026.
    en: >-
      **MTB**


      Tuesdays from 5:30 pm to 7:00 pm in Avià (technique and skills).


      Saturdays from 10:00 am to 1:00 pm, travelling around the region (route and
      technical work).


      **Enduro**


      Tuesdays from 5:30 pm to 7:00 pm at 4Riders Bike Park or other venues
      (mandatory base day).


      Thursdays from 5:30 pm to 7:00 pm, venue varies (complementary session).


      2026/2027 school year. Start: 15 September 2026.
  location:
    ca: >-
      Avià (BTT entre setmana), itineraris variables pel Berguedà els dissabtes,
      i 4Riders Bike Park o altres espais per a l'Enduro.
    es: >-
      Avià (BTT entre semana), itinerarios variables por el Berguedà los
      sábados, y 4Riders Bike Park u otros espacios para el Enduro.
    en: >-
      Avià (weekday MTB), changing routes around Berguedà on Saturdays, and
      4Riders Bike Park or other venues for Enduro.
  requirements:
    ca: >-
      Cal ser soci o sòcia del club MRB o del CEB.


      **BTT**


      - Bicicleta amb canvis, revisada i en bon estat.

      - Casc i guants.

      - Aigua; berenar els dissabtes.

      - Càmera i eines per a punxades.

      - Llums quan les condicions de llum ho requereixin.


      **Enduro**


      - Casc integral, guants, ulleres, genolleres, colzeres i protecció
      d'esquena.

      - Bicicleta adequada a la disciplina.

      - Llicència de la Federació Catalana de Ciclisme.
    es: >-
      Hay que ser socio o socia del club MRB o del CEB.


      **BTT**


      - Bicicleta con cambios, revisada y en buen estado.

      - Casco y guantes.

      - Agua; tentempié los sábados.

      - Cámara y herramientas para pinchazos.

      - Luces cuando las condiciones de luz lo requieran.


      **Enduro**


      - Casco integral, guantes, gafas, rodilleras, coderas y protección de
      espalda.

      - Bicicleta adecuada a la disciplina.

      - Licencia de la Federación Catalana de Ciclismo.
    en: >-
      Participants must be members of the MRB or CEB club.


      **MTB**


      - Geared bike, serviced and in good condition.

      - Helmet and gloves.

      - Water; a snack on Saturdays.

      - Inner tube and tools for punctures.

      - Lights when lighting conditions require them.


      **Enduro**


      - Full-face helmet, gloves, goggles, knee pads, elbow pads and back
      protection.

      - A bike suited to the discipline.

      - Catalan Cycling Federation licence.
  prices:
    ca: >-
      Curs 2026/2027. El preu no varia per edat, sinó per modalitat i dies:


      - BTT dimarts: 354 € el curs (142 € / 101 € / 111 € per trimestre)

      - BTT dissabte: 450 € el curs (186 € / 93 € / 171 € per trimestre)

      - BTT dimarts + dissabte: 582 € el curs (237 € / 134 € / 211 € per
      trimestre)

      - Pack de 5 dissabtes: 94 €

      - Enduro dimarts: 440 € el curs (173 € / 105 € / 162 € per trimestre)

      - Enduro dimarts + dijous: 683 € el curs (268 € / 163 € / 252 € per
      trimestre)


      BTT: inscripció trimestral. Enduro: inscripció anual (els imports per
      trimestre són el desglossament del pagament). El pack de 5 dissabtes
      prioritza qui ve els dimarts. Combinacions entre modalitats: a consultar.
    es: >-
      Curso 2026/2027. El precio no varía por edad, sino por modalidad y días:


      - BTT martes: 354 € el curso (142 € / 101 € / 111 € por trimestre)

      - BTT sábado: 450 € el curso (186 € / 93 € / 171 € por trimestre)

      - BTT martes + sábado: 582 € el curso (237 € / 134 € / 211 € por
      trimestre)

      - Pack de 5 sábados: 94 €

      - Enduro martes: 440 € el curso (173 € / 105 € / 162 € por trimestre)

      - Enduro martes + jueves: 683 € el curso (268 € / 163 € / 252 € por
      trimestre)


      BTT: inscripción trimestral. Enduro: inscripción anual (los importes por
      trimestre son el desglose del pago). El pack de 5 sábados prioriza a quien
      viene los martes. Combinaciones entre modalidades: a consultar.
    en: >-
      2026/2027 school year. Prices do not vary by age, but by modality and days
      attended:


      - MTB Tuesdays: 354 € for the year (142 € / 101 € / 111 € per term)

      - MTB Saturdays: 450 € for the year (186 € / 93 € / 171 € per term)

      - MTB Tuesdays + Saturdays: 582 € for the year (237 € / 134 € / 211 € per
      term)

      - Pack of 5 Saturdays: 94 €

      - Enduro Tuesdays: 440 € for the year (173 € / 105 € / 162 € per term)

      - Enduro Tuesdays + Thursdays: 683 € for the year (268 € / 163 € / 252 €
      per term)


      MTB: term-by-term registration. Enduro: annual registration (term amounts
      are the payment breakdown). The pack of 5 Saturdays prioritises Tuesday
      participants. Cross-modality combinations: ask the school.
