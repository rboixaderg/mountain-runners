summary:
  ca: Activitats de BTT per a infants i joves de 6 a 16 anys al Berguedà.
  es: Actividades de BTT para niños y jóvenes de 6 a 16 años en el Berguedà.
  en: MTB activities for children and young people aged 6 to 16 in Berguedà.
description:
  ca: >-
    L'Escola BTT és una de les branques dels MRB, juntament amb el CEB i
    Veloberga, per a grups d'infants i joves de 6 a 16 anys, en horari no
    lectiu, per l'entorn de la comarca del Berguedà.


    És un espai per descobrir la comarca amb bicicleta, aprendre tècnica i
    gaudir de la natura sense ser una escola d'alt rendiment.
  es: La Escuela BTT es una de las ramas de MRB, junto con el CEB y Veloberga, para grupos de niños y jóvenes de 6 a 16 años. Es un espacio para descubrir la comarca en bicicleta, aprender técnica y disfrutar de la naturaleza.
  en: The MTB School is one of MRB's branches, together with CEB and Veloberga, for groups of children and young people aged 6 to 16. It is a place to discover the region by bike, learn technique and enjoy nature.
