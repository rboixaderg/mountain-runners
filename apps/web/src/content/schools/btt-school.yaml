registrationStatus: coming-soon
sections:
  since:
    ca: >-
      L'escola pren vida l'any 2020 com a projecte pilot, creant sinergies amb
      altres entitats de Berga perquè infants i joves puguin descobrir nous
      racons de la comarca.
  purpose:
    ca: >-
      Donar l'opció d'estar a la natura, aprendre'n i gaudir-ne amb bicicleta
      mentre s'aprèn tècnica.
  audience:
    ca: Infants i joves de 6 a 16 anys.
  schedule:
    ca: >-
      **Entre setmana**


      Dimarts de 17.30 h a 19.00 h a Avià.


      **Cap de setmana**


      Dissabte de 10.00 h a 13.00 h, itinerant per la comarca del Berguedà.
  location:
    ca: Avià i itineraris variables per la comarca del Berguedà.
  requirements:
    ca: >-
      - Ser soci o sòcia del club MRB o del CEB.

      - Bicicleta amb canvis i en bon estat.

      - Casc, guants, bidó i motxilla.
  prices:
    ca: >-
      No varia en funció de l'edat, sinó dels dies que voleu venir.


      Els preus poden quedar subjectes a modificació a l'inici de curs.
