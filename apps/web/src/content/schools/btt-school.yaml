registrationStatus: coming-soon
sections:
  since:
    ca: >-
      L'escola pren vida l'any 2020 com a projecte pilot, creant sinergies amb
      altres entitats de Berga perquè infants i joves puguin descobrir nous
      racons de la comarca.
    es: La escuela nació en 2020 como proyecto piloto, creando sinergias con otras entidades de Berga para que los niños y jóvenes descubran nuevos rincones de la comarca.
    en: The school began in 2020 as a pilot project, creating synergies with other organisations in Berga so children and young people can discover new parts of the region.
  purpose:
    ca: >-
      Donar l'opció d'estar a la natura, aprendre'n i gaudir-ne amb bicicleta
      mentre s'aprèn tècnica.
    es: Ofrecer la posibilidad de estar en la naturaleza, aprender de ella y disfrutarla en bicicleta mientras se aprende técnica.
    en: To offer the chance to spend time in nature, learn from it and enjoy it by bike while learning technique.
  audience:
    ca: Infants i joves de 6 a 16 anys.
    es: Niños y jóvenes de 6 a 16 años.
    en: Children and young people aged 6 to 16.
  schedule:
    ca: >-
      **Entre setmana**


      Dimarts de 17.30 h a 19.00 h a Avià.


      **Cap de setmana**


      Dissabte de 10.00 h a 13.00 h, itinerant per la comarca del Berguedà.
    es: >-
      **Entre semana**

      Martes de 17:30 a 19:00 en Avià.

      **Fin de semana**

      Sábados de 10:00 a 13:00, itinerante por el Berguedà.
    en: >-
      **Weekdays**

      Tuesdays from 5:30 pm to 7:00 pm in Avià.

      **Weekend**

      Saturdays from 10:00 am to 1:00 pm, travelling around Berguedà.
  location:
    ca: Avià i itineraris variables per la comarca del Berguedà.
    es: Avià e itinerarios variables por la comarca del Berguedà.
    en: Avià and changing routes around the Berguedà region.
  requirements:
    ca: >-
      - Ser soci o sòcia del club MRB o del CEB.

      - Bicicleta amb canvis i en bon estat.

      - Casc, guants, bidó i motxilla.
    es: >-
      - Ser socio o socia del club MRB o del CEB.
      - Bicicleta con cambios y en buen estado.
      - Casco, guantes, bidón y mochila.
    en: >-
      - Be a member of the MRB or CEB club.
      - A bike with gears in good condition.
      - Helmet, gloves, bottle and backpack.
  prices:
    ca: >-
      No varia en funció de l'edat, sinó dels dies que voleu venir.


      Els preus poden quedar subjectes a modificació a l'inici de curs.
    es: Los precios pueden modificarse al inicio del curso.
    en: Prices may change at the start of the school year.
