name:
  ca: Escola BTT
summary:
  ca: Activitats de BTT per a infants i joves de 6 a 16 anys al Berguedà.
description:
  ca: >-
    L'Escola BTT és una de les branques dels MRB, juntament amb el CEB i
    Veloberga, per a grups d'infants i joves de 6 a 16 anys, en horari no
    lectiu, per l'entorn de la comarca del Berguedà.


    És un espai per descobrir la comarca amb bicicleta, aprendre tècnica i
    gaudir de la natura sense ser una escola d'alt rendiment.
