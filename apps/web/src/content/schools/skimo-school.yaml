name:
  ca: Escola Skimo
summary:
  ca: Formació en esquí de muntanya per a joves de 12 a 18 anys al Berguedà.
description:
  ca: >-
    L'Escola Skimo és una de les branques dels MRB: un projecte de formació de
    joves esportistes de 12 a 18 anys, en horari no lectiu, per l'entorn de la
    comarca del Berguedà.


    Oferim continuïtat per a qui vulgui iniciar-se o progressar en esquí de
    muntanya, amb possibilitat d'obrir la porta a la competició.
