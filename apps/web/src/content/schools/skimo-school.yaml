summary:
  ca: Formació en esquí de muntanya per a joves de 12 a 18 anys al Berguedà.
  es: Formación en esquí de montaña para jóvenes de 12 a 18 años en el Berguedà.
  en: Ski mountaineering training for young people aged 12 to 18 in Berguedà.
description:
  ca: >-
    L'Escola Skimo és una de les branques dels MRB: un projecte de formació de
    joves esportistes de 12 a 18 anys, en horari no lectiu, per l'entorn de la
    comarca del Berguedà.


    Oferim continuïtat per a qui vulgui iniciar-se o progressar en esquí de
    muntanya, amb possibilitat d'obrir la porta a la competició.
  es: >-
    La Escuela Skimo es una de las ramas de MRB: un proyecto de formación de
    jóvenes deportistas de 12 a 18 años, fuera del horario lectivo, por el
    entorno de la comarca del Berguedà.


    Acompañamos a quienes quieran iniciarse o progresar en el esquí de montaña,
    con la posibilidad de abrir la puerta a la competición.
  en: >-
    The Ski Mountaineering School is one of MRB's branches: a training project
    for young athletes aged 12 to 18, held outside school hours around Berguedà.


    We support young people who want to get started or progress in ski
    mountaineering, with the possibility of opening the door to competition.
