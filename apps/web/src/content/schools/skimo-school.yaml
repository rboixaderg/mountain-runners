sections:
  since:
    ca: >-
      Va néixer l'any 2014, aprofitant l'experiència de l'Escola Trail — escola
      pionera de curses de muntanya — per aplicar-la a l'esquí de muntanya.
    es: Nació en 2014, aprovechando la experiencia de la Escuela de Trail —pionera en carreras de montaña— para aplicarla al esquí de montaña.
    en: It began in 2014, building on the experience of the Trail School —a pioneer in mountain races— and applying it to ski mountaineering.
  purpose:
    ca: >-
      Oferir una formació en esquí de muntanya, donar continuïtat i obrir les
      portes a la competició a qui ho vulgui.
    es: Ofrecer formación en esquí de montaña, dar continuidad y abrir las puertas a la competición a quien lo desee.
    en: To provide ski mountaineering training, continuity and a path to competition for those who want it.
  audience:
    ca: Joves de 12 a 18 anys amb ganes de millorar.
    es: Jóvenes de 12 a 18 años con ganas de mejorar.
    en: Young people aged 12 to 18 who want to improve.
  schedule:
    ca: >-
      **Caps de setmana**


      - Temporada de tardor: dissabte cada 15 dies de 9.00 h a 13.00 h
        (diferents llocs del Berguedà; sessions amb rollers i caminar amb
        bastons).

      - Temporada de neu: dissabte de 9.00 h a 13.00 h (campionats de
        Catalunya i Espanya i sortides amb esquí de muntanya).


      **Entre setmana**


      - Fora de temporada de neu: dimarts i dijous de 17.00 h a 19.00 h a
        Berga (caminar amb bastons, trail i rollers).

      - Temporada de neu (Masella nit tancada): dimarts i dijous de 17.00 h a
        19.00 h a Masella (possibilitat d'entrenar als Rasos).

      - Temporada de neu (Masella nit oberta): dimarts de 17.00 h a 19.00 h i
      dijous de 17.00 h a 20.00 h a Masella.
    es: >-
      **Fines de semana**


      - Temporada de otoño: sábado cada 15 días de 9:00 a 13:00 (diferentes
        lugares del Berguedà; sesiones con rollers y marcha con bastones).

      - Temporada de nieve: sábado de 9:00 a 13:00 (campeonatos de Cataluña y
        España y salidas de esquí de montaña).


      **Entre semana**


      - Fuera de la temporada de nieve: martes y jueves de 17:00 a 19:00 en
        Berga (marcha con bastones, trail y rollers).

      - Temporada de nieve (esquí nocturno de Masella cerrado): martes y jueves
        de 17:00 a 19:00 en Masella (posibilidad de entrenar en los Rasos).

      - Temporada de nieve (esquí nocturno de Masella abierto): martes de 17:00
        a 19:00 y jueves de 17:00 a 20:00 en Masella.
    en: >-
      **Weekends**


      - Autumn season: every other Saturday from 9:00 am to 1:00 pm at different
        locations in Berguedà, with roller-skiing and pole-walking sessions.

      - Snow season: Saturdays from 9:00 am to 1:00 pm, including Catalan and
        Spanish championships and ski mountaineering outings.


      **Weekdays**


      - Outside the snow season: Tuesdays and Thursdays from 5:00 pm to 7:00 pm
        in Berga, with pole walking, trail running and roller-skiing.

      - Snow season, when Masella night skiing is unavailable: Tuesdays and
        Thursdays from 5:00 pm to 7:00 pm in Masella, with the possibility of
        training at Rasos.

      - Snow season, when Masella night skiing is available: Tuesdays from 5:00
        pm to 7:00 pm and Thursdays from 5:00 pm to 8:00 pm in Masella.
  location:
    ca: Berga, Masella, Rasos i diferents indrets del Berguedà segons la temporada.
    es: Berga, Masella, Rasos y diferentes lugares del Berguedà según la temporada.
    en: Berga, Masella, Rasos and different places in Berguedà depending on the season.
  requirements:
    ca: >-
      - Ser soci o sòcia dels Mountain Runners.

      - Llicència federativa D habilitada per la FEDME.

      - Bon nivell d'esquí alpí (capacitat de baixar per tot tipus de pista).

      - Material d'esquí de muntanya i de rollers.
    es: >-
      - Ser socio o socia de Mountain Runners.

      - Licencia federativa D habilitada por la FEDME.

      - Buen nivel de esquí alpino (capacidad para bajar por todo tipo de pistas).

      - Material de esquí de montaña y rollers.
    en: >-
      - Be a Mountain Runners member.

      - Hold a category D federation licence enabled by FEDME.

      - Have a good alpine skiing level, with the ability to descend every type
        of piste.

      - Have ski mountaineering and roller-ski equipment.
  prices:
    ca: >-
      No varia en funció de l'edat, sinó dels dies que voleu venir:


      - Quota anual escola: 550 €

      - Entre setmana: 60 € al mes si venen dimarts i dijous; 30 € al mes si
        només venen un dia

      - Matrícula: 80 € (inclou tràmits d'inscripció i la jaqueta de l'escola)


      Els preus poden quedar subjectes a modificació a l'inici de curs.
    es: >-
      No varía en función de la edad, sino de los días que queráis venir:


      - Cuota anual de la escuela: 550 €

      - Entre semana: 60 € al mes si vienen martes y jueves; 30 € al mes si solo
        vienen un día

      - Matrícula: 80 € (incluye los trámites de inscripción y la chaqueta de la
        escuela)


      Los precios pueden quedar sujetos a modificaciones al inicio del curso.
    en: >-
      Prices do not vary by age, but by the number of days participants attend:


      - Annual school fee: €550

      - Weekdays: €60 per month for Tuesdays and Thursdays; €30 per month for one
        day only

      - Registration fee: €80, including registration administration and the
        school jacket


      Prices may change at the start of the school year.
