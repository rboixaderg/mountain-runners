sections:
  since:
    ca: >-
      L'escola pren vida l'any 2012 i des de llavors els infants i joves de la
      comarca no han parat de descobrir nous racons del Berguedà.
    es: La escuela nació en 2012 y desde entonces los niños y jóvenes de la comarca han seguido descubriendo nuevos rincones del Berguedà.
    en: The school began in 2012, and since then children and young people from the region have continued discovering new corners of Berguedà.
  purpose:
    ca: >-
      L'objectiu no és una escola d'alt rendiment sinó donar l'opció d'estar a
      la natura, aprendre d'ella i gaudir-la.
    es: El objetivo no es ser una escuela de alto rendimiento, sino ofrecer la posibilidad de estar en la naturaleza, aprender de ella y disfrutarla.
    en: The aim is not to be a high-performance school, but to offer the chance to spend time in nature, learn from it and enjoy it.
  audience:
    ca: Infants i joves de 3 a 18 anys.
    es: Niños y jóvenes de 3 a 18 años.
    en: Children and young people aged 3 to 18.
  schedule:
    ca: >-
      **Berga:** dilluns, dimecres i divendres de 17.30 h a 19.00 h.


      Durant el curs escolar.
    es: "**Berga:** lunes, miércoles y viernes de 17:30 a 19:00. Durante el curso escolar."
    en: "**Berga:** Monday, Wednesday and Friday from 5:30 pm to 7:00 pm. During the school year."
  location:
    ca: >-
      Sortida a la Font Negra de Berga en horari d'estiu, sortida a l'Escola
      Sant Joan de Berga en horari d'hivern, amb itineraris diferents a cada
      sessió.
    es: >-
      Salida en la Font Negra de Berga en horario de verano, salida en la
      Escola Sant Joan de Berga en horario de invierno, con itinerarios
      diferentes en cada sesión.
    en: >-
      Depart from Font Negra in Berga during the summer schedule, depart from
      Escola Sant Joan in Berga during the winter schedule, with a different
      route each session.
  prices:
    ca: >-
      No varia en funció de l'edat, sinó dels dies que voleu venir:


      - 1 dia: 35 € al mes

      - 2 dies: 45 € al mes

      - 3 dies: 50 € al mes

      - Matrícula primer any: 50 €; matrícula de continuïtat: 25 €


      Els preus poden quedar subjectes a modificació a l'inici de curs.
    es: "Los precios no varían según la edad, sino según los días: 1 día, 35 € al mes; 2 días, 45 € al mes; 3 días, 50 € al mes. Matrícula del primer año, 50 €; continuidad, 25 €. Pueden modificarse al inicio del curso."
    en: "Prices do not vary by age, but by the number of days: 1 day, €35 per month; 2 days, €45 per month; 3 days, €50 per month. First-year registration, €50; continuing registration, €25. They may change at the start of the school year."
