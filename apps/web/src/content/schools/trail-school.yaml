summary:
  ca: Classes de trail per a infants i joves de 3 a 18 anys al Berguedà.
  es: Clases de trail para niños y jóvenes de 3 a 18 años en el Berguedà.
  en: Trail classes for children and young people aged 3 to 18 in Berguedà.
description:
  ca: >-
    L'Escola Trail és una de les branques dels MRB i ofereix classes de trail
    per a grups d'infants i joves de 3 a 18 anys, en horari no lectiu, per
    l'entorn de la comarca del Berguedà.


    Els monitors transmeten l'esforç, el treball en equip, el respecte a la
    natura i la constància mentre els infants i joves descobreixen nous racons
    del Berguedà.
  es: >-
    La Escuela de Trail es una de las ramas de MRB y ofrece clases de trail para
    grupos de niños y jóvenes de 3 a 18 años, fuera del horario lectivo, por el
    entorno de la comarca del Berguedà.


    Los monitores transmiten el esfuerzo, el trabajo en equipo, el respeto por
    la naturaleza y la constancia mientras los niños y jóvenes descubren nuevos
    rincones del Berguedà.
  en: >-
    The Trail School is one of MRB's branches and offers trail running classes
    for groups of children and young people aged 3 to 18, held outside school
    hours around Berguedà.


    The coaches pass on the values of effort, teamwork, respect for nature and
    perseverance while the children and young people discover new parts of
    Berguedà.
