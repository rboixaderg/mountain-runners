name:
  ca: Escola de Trail
summary:
  ca: Classes de trail per a infants i joves de 3 a 18 anys al Berguedà.
description:
  ca: >-
    L'Escola Trail és una de les branques dels MRB i ofereix classes de trail
    per a grups d'infants i joves de 3 a 18 anys, en horari no lectiu, per
    l'entorn de la comarca del Berguedà.


    Els monitors transmeten l'esforç, el treball en equip, el respecte a la
    natura i la constància mentre els infants i joves descobreixen nous racons
    del Berguedà.
